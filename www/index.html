<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>巴士问答</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f4f8;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  overflow: hidden;
}
.wrap { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 640px; margin: 0 auto; min-height: 0; }
.screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ===== Menu screens ===== */
.menu-title { font-size: 22px; color: #1a365d; text-align: center; padding: 30px 16px 8px; font-weight: bold; flex-shrink: 0; }
.menu-sub { font-size: 13px; color: #888; text-align: center; padding: 0 16px 20px; flex-shrink: 0; }
.menu-grid { display: flex; flex-direction: column; gap: 12px; padding: 10px 20px; flex: 1; overflow-y: auto; }
.menu-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 18px 16px; border: none; border-radius: 14px;
  font-size: 17px; font-weight: bold; cursor: pointer;
  color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1);
  transition: transform .1s;
}
.menu-btn:active { transform: scale(0.97); }
.menu-btn.blue { background: linear-gradient(135deg, #3182ce, #2b6cb0); }
.menu-btn.green { background: linear-gradient(135deg, #38a169, #2f855a); }
.menu-btn.orange { background: linear-gradient(135deg, #dd6b20, #c05621); }
.menu-btn.purple { background: linear-gradient(135deg, #805ad5, #6b46c1); }
.menu-btn.red { background: linear-gradient(135deg, #e53e3e, #c53030); }
.menu-btn.teal { background: linear-gradient(135deg, #319795, #2c7a7b); }
.menu-btn.dark { background: linear-gradient(135deg, #2d3748, #1a202c); }
.menu-btn.cyan { background: linear-gradient(135deg, #0987a0, #086f83); }
.menu-btn.pink { background: linear-gradient(135deg, #d53f8c, #b83280); }
.menu-btn .emoji { font-size: 24px; }
.menu-back {
  margin: 12px 20px 20px; padding: 13px; border: 2px solid #cbd5e0;
  background: transparent; color: #4a5568; border-radius: 12px;
  font-size: 15px; cursor: pointer; flex-shrink: 0;
}
.menu-back:active { background: #e2e8f0; }

/* ===== Quiz screen ===== */
h1 { font-size: 18px; color: #1a365d; text-align: center; padding: 10px 12px 2px; flex-shrink: 0; }
.score-bar { display: flex; justify-content: center; gap: 14px; padding: 6px 12px; font-size: 13px; color: #555; flex-shrink: 0; flex-wrap: wrap; }
.score-bar b { color: #1a365d; }
.card {
  flex: 1; display: flex; flex-direction: column;
  background: #fff; border-radius: 16px 16px 0 0;
  margin: 8px 10px 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -2px 12px rgba(0,0,0,.06); min-height: 0; overflow-y: auto;
}
.route-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.route-badge { background: #e53e3e; color: #fff; font-size: 28px; font-weight: bold; padding: 6px 20px; border-radius: 8px; }
.co-logos { display: flex; gap: 6px; flex-wrap: wrap; }
.co-logos img { height: 36px; border-radius: 6px; }
.co { color: #888; font-size: 12px; margin-bottom: 12px; }
label { display: block; font-size: 13px; color: #444; margin: 10px 0 5px; }
input {
  width: 100%; padding: 11px 13px; border: 2px solid #ddd; border-radius: 10px;
  font-size: 16px; outline: none; background: #fafbfc;
}
input:focus { border-color: #3182ce; background: #fff; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-shrink: 0; }
button { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn-primary { background: #3182ce; color: #fff; }
.btn-primary:active { background: #2b6cb0; }
.btn-ghost { background: #edf2f7; color: #444; }
.btn-ghost:active { background: #e2e8f0; }
.result { margin-top: 14px; padding: 14px; border-radius: 10px; display: none; font-size: 15px; line-height: 1.8; flex-shrink: 0; }
.result.ok { background: #c6f6d5; color: #22543d; }
.result.half { background: #feebc8; color: #7b341e; }
.result.bad { background: #fed7d7; color: #822727; }
.hint { background: #ebf8ff; border-radius: 10px; padding: 9px 12px; font-size: 12px; color: #2c5282; margin-top: 12px; line-height: 1.7; flex-shrink: 0; }
.back-btn {
  margin: 8px 10px 0; padding: 8px 14px; border: none; border-radius: 8px;
  background: #e2e8f0; color: #4a5568; font-size: 13px; cursor: pointer;
  align-self: flex-start; flex-shrink: 0;
}
.back-btn:active { background: #cbd5e0; }

/* 16:9 short screens */
@media (max-height: 640px) {
  .menu-title { padding: 16px 16px 4px; font-size: 18px; }
  .menu-sub { padding: 0 16px 10px; }
  .menu-grid { gap: 8px; padding: 6px 16px; }
  .menu-btn { padding: 13px 12px; font-size: 15px; }
  h1 { font-size: 16px; padding: 6px 12px 0; }
  .score-bar { padding: 4px 12px; font-size: 12px; gap: 10px; }
  .card { padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; }
  .route-badge { font-size: 24px; padding: 5px 16px; }
  .co-logos img { height: 28px; }
  .co { margin-bottom: 6px; }
  label { margin: 6px 0 3px; }
  input { padding: 9px 12px; }
  .btn-row { margin-top: 10px; }
  button { padding: 11px; }
  .result { margin-top: 10px; padding: 11px; font-size: 14px; }
  .hint { display: none; }
}
/* tall screens */
@media (min-height: 800px) {
  .menu-title { font-size: 26px; padding: 40px 16px 10px; }
  .menu-btn { padding: 22px 16px; font-size: 18px; }
  h1 { font-size: 20px; padding: 14px 12px 4px; }
  .route-badge { font-size: 32px; padding: 8px 22px; }
}
</style>
</head>

<div class="wrap">

<!-- ===== Screen 0: Main Menu ===== -->
<div class="screen active" id="scrMenu">

  <div class="menu-sub">选择答题模式</div>
  <div class="menu-grid">
    <button class="menu-btn blue" onclick="showRegionMenu()">

    </button>
    <button class="menu-btn green" onclick="showOperatorMenu()">
      <span class="emoji">🚌</span> 按营办商答题
    </button>
  </div>
</div>

<!-- ===== Screen 1: Region Menu ===== -->
<div class="screen" id="scrRegion">
  <div class="menu-title">🗺️ 选择地区</div>
  <div class="menu-sub">选择你想练习的区域</div>
  <div class="menu-grid">
    <button class="menu-btn green" onclick="startQuiz('region','新界西')">

    </button>
    <button class="menu-btn pink" onclick="startQuiz('region','港島')">
      <span class="emoji">🏝️</span> 港岛
    </button>
    <button class="menu-btn cyan" onclick="startQuiz('region','大嶼山')">
      <span class="emoji">✈️</span> 大屿山
    </button>
    <button class="menu-btn red" onclick="startQuiz('region','隧道過海')">
      <span class="emoji">🚇</span> 隧道过海
    </button>
  </div>
  <button class="menu-back" onclick="showMainMenu()">← 返回主菜单</button>
</div>

<!-- ===== Screen 2: Operator Menu ===== -->
<div class="screen" id="scrOperator">
  <div class="menu-title">🚌 选择营办商</div>
  <div class="menu-sub">选择你想练习的巴士公司</div>
  <div class="menu-grid">
    <button class="menu-btn red" onclick="startQuiz('co','kmb')">
      <span class="emoji">🔴</span> 九巴 KMB
    </button>
    <button class="menu-btn blue" onclick="startQuiz('co','ctb')">
      <span class="emoji">🔵</span> 城巴 Citybus
    </button>
    <button class="menu-btn orange" onclick="startQuiz('co','lwb')">
      <span class="emoji">🟠</span> 龙运 Long Win
    </button>
    <button class="menu-btn green" onclick="startQuiz('co','nlb')">
      <span class="emoji">🟢</span> 新大屿山巴士 NLB
    </button>
  </div>
  <button class="menu-back" onclick="showMainMenu()">← 返回主菜单</button>
</div>

<!-- ===== Screen 3: Quiz ===== -->
<div class="screen" id="scrQuiz">
  <button class="back-btn" onclick="showMainMenu()">← 返回菜单</button>
  <h1>🚌 香港巴士起止点问答</h1>
  <div class="score-bar">
    <span>全对 <b id="sFull">0</b></span>
    <span>半对 <b id="sHalf">0</b></span>
    <span>不对 <b id="sBad">0</b></span>
    <span>题号 <b id="sIdx">1</b></span>
    <span>题库 <b id="sTotal">0</b></span>
  </div>
  <div class="card">
    <div class="route-row">
      <div class="route-badge" id="routeNo">--</div>
      <div class="co-logos" id="coLogos"></div>
    </div>
    <div class="co" id="coName"></div>
    <label>起点</label>
    <input id="inFrom" placeholder="例：竹園邨" autocomplete="off">
    <label>终点</label>
    <input id="inTo" placeholder="例：尖沙咀碼頭" autocomplete="off">
    <div class="btn-row">
      <button class="btn-primary" onclick="check()">提交答案</button>
      <button class="btn-ghost" onclick="skip()">跳过</button>
    </div>
    <div class="result" id="result"></div>
    <div class="btn-row" id="nextRow" style="display:none">
      <button class="btn-primary" onclick="next()">下一题 →</button>
    </div>
    <div class="hint">
      💡 起止点都对 = 全对；对一端 = 半对。顺序随意，简繁均可，可简写。
    </div>
  </div>
</div>

</div>

const S2T = '园園码碼头頭环環运運输輸处處顶頂龙龍湾灣贡貢窝窩坚堅观觀辅輔将將军軍启啟业業学學乐樂红紅轮輪钟鐘区區医醫门門么麼长長苏蘇兴興华華贵貴数數场場云雲贝貝乡鄉专專线綫务務钻鑽购購货貨会會铁鐵经經邮郵厂廠国國锦錦汉漢农農护護养養晓曉晖暉爱愛丽麗岭嶺树樹马馬篱籬陇隴亿億顺順圣聖约約恒恆围圍沥瀝鸭鴨风風联聯宁寧赋賦铜銅优優伟偉银銀泽澤亚亞萝蘿兰蘭对對众眾监監狱獄显顯径徑担擔别別旧舊转轉点點黄黃财財垒壘狮獅调調阁閣赛賽诊診卫衛礼禮琼瓊轩軒亲親尔爾涛濤庙廟禅禪咸鹹柜櫃号號机機览覽馆館妈媽横橫悦悅湿濕来來';
const MAP = {}; for (let i = 0; i < S2T.length; i += 2) MAP[S2T[i]] = S2T[i+1];
function s2t(s) { let r=''; for (const c of s) r += (MAP[c]||c); return r; }
const CO = { kmb:'九巴', ctb:'城巴', nwfb:'城巴', nlb:'嶼巴', lwb:'龍運' };
const CO_LOGO = { kmb:'kmb', ctb:'ctb', nwfb:'ctb', nlb:'nlb', lwb:'lwb' };

let pool = [], cur = null, used = new Set(), score = {full:0, half:0, bad:0}, idx = 0;

// ===== Screen navigation =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showMainMenu() { showScreen('scrMenu'); }
function showRegionMenu() { showScreen('scrRegion'); }
function showOperatorMenu() { showScreen('scrOperator'); }

function startQuiz(type, key) {
  if (type === 'region') {
    pool = QUIZ.filter(q => q.regions && q.regions.includes(key));
  } else {
    pool = QUIZ.filter(q => {
      const cos = q.co.split('/');
      return cos.includes(key) || (key === 'ctb' && (cos.includes('ctb') || cos.includes('nwfb')));
    });
  }
  if (pool.length === 0) { alert('该分类暂无题目'); return; }
  used.clear(); score = {full:0, half:0, bad:0}; idx = 0;
  document.getElementById('sTotal').textContent = pool.length;
  showScreen('scrQuiz');
  show();
}

function pick() {
  if (used.size >= pool.length) used.clear();
  let i;
  do { i = Math.floor(Math.random() * pool.length); } while (used.has(i));
  used.add(i); idx++;
  return pool[i];
}
function norm(s) {
  return s2t((s||'').replace(/[\s（）()［］\[\]・·．.，,、—－-]/g,'').toLowerCase());
}
function match(a, b) {
  const A = norm(a), B = norm(b);
  if (!A || !B) return false;
  if (A === B || A.includes(B) || B.includes(A)) return true;
  for (let i = 0; i < A.length - 1; i++) {
    if (B.includes(A.substr(i, 2))) return true;
  }
  return false;
}
function show() {
  cur = pick();
  document.getElementById('routeNo').textContent = cur.route;
  // operator logos
  const coCodes = cur.co.split('/');
  const logoDiv = document.getElementById('coLogos');
  logoDiv.innerHTML = '';
  const seen = new Set();
  for (const c of coCodes) {
    const logoKey = CO_LOGO[c];
    if (logoKey && !seen.has(logoKey) && LOGOS[logoKey]) {
      seen.add(logoKey);
      const img = document.createElement('img');
      img.src = LOGOS[logoKey];
      img.alt = CO[c] || c;
      logoDiv.appendChild(img);
    }
  }
  const cos = coCodes.map(c => CO[c] || c).join(' / ');
  document.getElementById('coName').textContent = '运营：' + (cos || '—');
  document.getElementById('inFrom').value = '';
  document.getElementById('inTo').value = '';
  const r = document.getElementById('result');
  r.className = 'result'; r.style.display = 'none';
  document.getElementById('nextRow').style.display = 'none';
  document.getElementById('sIdx').textContent = idx;
}
function check() {
  const uf = document.getElementById('inFrom').value;
  const ut = document.getElementById('inTo').value;
  if (!uf.trim() || !ut.trim()) { alert('请填写起点和终点'); return; }
  const direct = match(uf, cur.from_zh) && match(ut, cur.to_zh);
  const swap   = match(uf, cur.to_zh)   && match(ut, cur.from_zh);
  const oneEnd = match(uf, cur.from_zh) || match(ut, cur.to_zh) || match(uf, cur.to_zh) || match(ut, cur.from_zh);
  const r = document.getElementById('result');
  let cls, html;
  if (direct || swap) {
    cls = 'ok'; score.full++;
    html = '✅ <b>全对！</b><br>正确答案：<b>' + cur.from_zh + ' ↔ ' + cur.to_zh + '</b>';
  } else if (oneEnd) {
    cls = 'half'; score.half++;
    html = '🟡 <b>半对</b>（对了一端）<br>正确答案：<b>' + cur.from_zh + ' ↔ ' + cur.to_zh + '</b>';
  } else {
    cls = 'bad'; score.bad++;
    html = '❌ <b>不对</b><br>正确答案：<b>' + cur.from_zh + ' ↔ ' + cur.to_zh + '</b>';
  }
  r.className = 'result ' + cls;
  r.style.display = 'block';
  r.innerHTML = html;
  document.getElementById('sFull').textContent = score.full;
  document.getElementById('sHalf').textContent = score.half;
  document.getElementById('sBad').textContent = score.bad;
  document.getElementById('nextRow').style.display = 'flex';
}
function skip() {
  score.bad++;
  document.getElementById('sBad').textContent = score.bad;
  const r = document.getElementById('result');
  r.className = 'result bad';
  r.style.display = 'block';
  r.innerHTML = '⏭ <b>已跳过</b><br>正确答案：<b>' + cur.from_zh + ' ↔ ' + cur.to_zh + '</b>';
  document.getElementById('nextRow').style.display = 'flex';
}
function next() {
  show();
  document.getElementById('inFrom').focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('nextRow').style.display !== 'none') next();
    else if (document.getElementById('scrQuiz').classList.contains('active')) check();
  }
});
</script>
